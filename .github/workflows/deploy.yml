name: publish-to-github-pages
on:
    push:
        branches:
            - master # Ensure this matches your default branch name

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub
permissions:
    contents: read
    pages: write
    id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    # Build job
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js - Cache dependencies - Install dependencies
              uses: ./.github/workflows/setup-node

            - name: Setup Pages
              uses: actions/configure-pages@v4
              with:
                  static_site_generator: next

            - name: Build with Next.js
              run: npx next build

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./out # Next.js exports static files to the 'out' directory by default

    # Deployment job
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
